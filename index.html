<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sää – Vantaa</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: linear-gradient(to bottom, #4a90e2, #50e3c2);
    font-family: 'Arial Black', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .weather-container {
    text-align: center;
    background: rgba(0,0,0,0.4);
    padding: 50px 80px;
    border-radius: 25px;
  }

  h1 {
    font-size: 4rem;
    margin-bottom: 20px;
    color: #fff;
  }

  .temp {
    font-size: 10rem;
    font-weight: bold;
    margin: 20px 0;
    color: #fff;
  }

  .icon {
    font-size: 6rem;
    margin-bottom: 10px;
  }

  .desc {
    font-size: 3rem;
    margin-bottom: 15px;
    color: #fff;
  }

  #time {
    font-size: 2rem;
    opacity: 0.9;
    color: #fff;
  }

  @media (max-width: 1200px) {
    .temp { font-size: 7rem; }
    h1 { font-size: 3rem; }
    .icon { font-size: 4rem; }
    .desc { font-size: 2rem; }
    #time { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<div class="weather-container">
  <h1>Sää – Vantaa</h1>
  <div class="icon" id="icon">☀️</div>
  <div class="temp" id="temp">…</div>
  <div class="desc" id="desc">Ladataan säätietoja…</div>
  <div id="time"></div>
</div>

<script>
// Koordinaatit: Vantaa
const lat = 60.2934;
const lon = 25.0378;
const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=Europe/Helsinki`;

// Päivitä säätiedot
function updateWeather() {
  fetch(apiUrl)
    .then(resp => resp.json())
    .then(data => {
      const w = data.current_weather;
      const tempElem = document.getElementById("temp");
      const descElem = document.getElementById("desc");
      const timeElem = document.getElementById("time");
      const iconElem = document.getElementById("icon");

      // Lämpötila
      tempElem.textContent = `${w.temperature.toFixed(1)} °C`;

      // Sääkuvaus ja ikoni
      let desc = "Ei tietoa";
      let icon = "❓";

      const code = w.weathercode;
      if (code === 0) { desc = "Selkeää"; icon = "☀️"; }
      if (code >= 1 && code <= 3) { desc = "Pilvistä"; icon = "⛅"; }
      if (code >= 45 && code <= 48) { desc = "Sumua"; icon = "🌫️"; }
      if (code >= 51 && code <= 57) { desc = "Heikkoa sadetta"; icon = "🌦️"; }
      if (code >= 61 && code <= 67) { desc = "Sade"; icon = "🌧️"; }
      if (code >= 71 && code <= 77) { desc = "Lumikuuroja"; icon = "🌨️"; }
      if (code >= 80 && code <= 82) { desc = "Sadekuuroja"; icon = "🌧️"; }
      if (code >= 95) { desc = "Ukkosta"; icon = "⛈️"; }

      descElem.textContent = desc;
      iconElem.textContent = icon;
      timeElem.textContent = `Päivitetty: ${w.time.replace("T", " ")}`;
    })
    .catch(err => {
      document.getElementById("desc").textContent = "Virhe haettaessa säätä";
      console.error(err);
    });
}

// Alusta
updateWeather();

// Automaattinen päivitys 5 minuutin välein
setInterval(updateWeather, 300000); // 300000 ms = 5 min
</script>

</body>
</html>
