<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sää – Vantaa</title>
<style>
  /* Täyttää koko näytön */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: linear-gradient(to bottom, #4a90e2, #50e3c2); /* sinivihreä tausta */
    color: #fff;
    font-family: 'Arial Black', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .weather-container {
    text-align: center;
    background: rgba(0, 0, 0, 0.4); /* hieman läpinäkyvä tumma tausta tekstille */
    padding: 40px 60px;
    border-radius: 20px;
  }

  h1 {
    font-size: 4rem;
    margin-bottom: 20px;
  }

  .temp {
    font-size: 10rem;
    font-weight: bold;
    margin: 20px 0;
  }

  .desc {
    font-size: 3rem;
    margin-bottom: 10px;
  }

  #time {
    font-size: 2rem;
    opacity: 0.8;
  }

  @media (max-width: 1200px) {
    .temp { font-size: 7rem; }
    h1 { font-size: 3rem; }
    .desc { font-size: 2rem; }
    #time { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<div class="weather-container">
  <h1>Sää – Vantaa</h1>
  <div class="temp" id="temp">…</div>
  <div class="desc" id="desc">Ladataan säätietoja…</div>
  <div id="time"></div>
</div>

<script>
// Koordinaatit: Vantaa
const lat = 60.2934;
const lon = 25.0378;

// Open‑Meteo API (ei avainta)
const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=Europe/Helsinki`;

fetch(url)
  .then(resp => resp.json())
  .then(data => {
    const w = data.current_weather;
    const tempElem = document.getElementById("temp");
    const descElem = document.getElementById("desc");
    const timeElem = document.getElementById("time");

    // Lämpötila
    tempElem.textContent = `${w.temperature.toFixed(1)} °C`;

    // Sääkuvaus (yksinkertainen)
    let desc = "Ei tietoa";
    const code = w.weathercode;
    if (code === 0) desc = "Selkeää";
    if (code >= 1 && code <= 3) desc = "Pilvistä";
    if (code >= 45 && code <= 48) desc = "Sumua";
    if (code >= 51 && code <= 57) desc = "Heikkoa sadetta";
    if (code >= 61 && code <= 67) desc = "Sade";
    if (code >= 71 && code <= 77) desc = "Lumikuuroja";
    if (code >= 80 && code <= 82) desc = "Sadekuuroja";
    if (code >= 95) desc = "Ukkosta";

    descElem.textContent = desc;
    timeElem.textContent = `Päivitetty: ${w.time.replace("T", " ")}`;
  })
  .catch(err => {
    document.getElementById("desc").textContent = "Virhe haettaessa säätä";
    console.error(err);
  });
  
  // Päivittää koko sivun 5 minuutin välein (300000 ms)
  setTimeout(() => {
    location.reload();
  }, 300000);
</script>

</body>
</html>
