<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sää – Vantaa</title>
<style>
  body {
    font-family: Arial, sans-serif;
    color: #222;
    background: #fff;
    text-align: center;
    padding: 20px;
  }
  .weather {
    margin-top: 30px;
    font-size: 1.4rem;
  }
  .temp {
    font-size: 3rem;
    font-weight: bold;
  }
  .desc {
    font-size: 1.2rem;
    margin-top: 8px;
  }
</style>
</head>
<body>

<h1>Sää – Vantaa</h1>

<div class="weather">
  <div class="temp" id="temp">…</div>
  <div class="desc" id="desc">Ladataan säätietoja…</div>
  <div id="time"></div>
</div>

<script>
// Koordinaatit: Vantaa
const lat = 60.2934;
const lon = 25.0378;

// Open‑Meteo API (ei avainta)
const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=Europe/Helsinki`;

fetch(url)
  .then(resp => resp.json())
  .then(data => {
    const w = data.current_weather;
    const tempElem = document.getElementById("temp");
    const descElem = document.getElementById("desc");
    const timeElem = document.getElementById("time");

    // Lämpötila
    tempElem.textContent = `${w.temperature.toFixed(1)} °C`;

    // Sääkuvaus (yksinkertainen)
    let desc = "Ei tietoa";
    const code = w.weathercode;
    if (code === 0) desc = "Selkeää";
    if (code >= 1 && code <= 3) desc = "Pilvistä";
    if (code >= 45 && code <= 48) desc = "Sumua";
    if (code >= 51 && code <= 57) desc = "Heikkoa sadetta";
    if (code >= 61 && code <= 67) desc = "Sade";
    if (code >= 71 && code <= 77) desc = "Lumikuuroja";
    if (code >= 80 && code <= 82) desc = "Sadekuuroja";
    if (code >= 95) desc = "Ukkosta";

    descElem.textContent = desc;
    timeElem.textContent = `Päivitetty: ${w.time.replace("T", " ")}`;
  })
  .catch(err => {
    document.getElementById("desc").textContent = "Virhe haettaessa säätä";
    console.error(err);
  });
</script>

</body>
</html>
